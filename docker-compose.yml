# Production stack, deployed by Dokploy (Compose type).
#
# Environment comes from the .env file Dokploy writes next to this compose file
# from the application's Environment tab -- NOT from any .env in a clone of the
# repository. `env_file` passes it through wholesale on purpose: enumerating the
# variables here meant this file had to be edited every time one was added, and
# a forgotten one arrived as an empty string rather than as an error.
#
# Required there:
#   CLICKHOUSE_HOST/PORT/USER/PASSWORD/DATABASE
#   SSH_HOST/SSH_PORT/SSH_USER  + SSH_PRIVATE_KEY_B64 (or a mounted key, below)
#   NETHUNT_API_TOKEN, NETHUNT_FOLDER_ID, NETHUNT_UTILS_FOLDER_ID
#   SYNC_API_KEY
# Optional: TELEGRAM_*, NOTIFY_*, DAILY_REPORT_AT, BATCH_SIZE,
#   MAX_CONCURRENT_REQUESTS, SYNC_INTERVAL_MINUTES, CACHE_TTL_SECONDS
#
# Generate the key value with:  base64 -i ~/.ssh/id_ed25519 | tr -d '\n'

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # only what must not come from the environment file
    environment:
      PORT: 3000
      # Redis is a sibling container, never localhost
      REDIS_URL: redis://redis:6379

    # The key can also be mounted instead of pasted into the environment, which
    # suits a key that already lives on the server. Uncomment, point the source
    # at the real path, and set SSH_KEY_PATH=/home/node/.ssh/id_ed25519.
    # The file must be readable by uid 1000, the `node` user inside the image.
    #
    # volumes:
    #   - /home/deploy/.ssh/id_ed25519:/home/node/.ssh/id_ed25519:ro

    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # the id cache must survive a restart: without it the next sync falls back
    # to a search call per record
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
